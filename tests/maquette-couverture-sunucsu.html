<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maquette SunuCSU — données fictives</title><style>body{font:16px system-ui,sans-serif;background:#f4f7f6;color:#172b28;margin:0;padding:20px}main{max-width:560px;margin:auto;background:white;border-radius:16px;padding:22px;box-shadow:0 4px 20px #0001}h1{font-size:23px}label{display:block;margin:14px 0 5px;font-weight:600}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #b9c8c5;border-radius:9px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:9px;background:#126b5c;color:white;font:inherit;margin-top:20px}.note{background:#f2f5f5;padding:12px;border-radius:8px}.state{font-weight:700;margin:18px 0}.valid{color:#146b43}.expired{color:#9e3030}.unknown{color:#755c16}dl{display:grid;grid-template-columns:1fr 1fr;gap:12px}dt{font-size:13px;color:#576a66}dd{margin:4px 0 0;font-weight:600}section{margin-top:20px}small{color:#536b65}</style></head><body><main><h1>Vérification SunuCSU — maquette</h1><p class="note"><strong>Simulation uniquement.</strong> Toutes les identités ci-dessous sont fictives. Aucune connexion à SunuCSU ou Supabase, aucune donnée patient enregistrée.</p><label for="scenario">Scénario de démonstration</label><select id="scenario"><option value="valid">Couverture valide</option><option value="expired">Couverture expirée</option><option value="unknown">Service indisponible / non vérifiée</option></select><button id="simulate" type="button">Simuler une vérification</button><section id="result" aria-live="polite" hidden><div id="status" class="state"></div><dl><div><dt>Nom</dt><dd id="nom"></dd></div><div><dt>Prénoms</dt><dd id="prenom"></dd></div><div><dt>N° immatriculation</dt><dd id="numero"></dd></div><div><dt>Date de naissance</dt><dd id="birth"></dd></div><div><dt>Début de couverture</dt><dd id="start"></dd></div><div><dt>Fin de couverture</dt><dd id="end"></dd></div></dl><p><small id="source"></small></p></section></main><script>(()=>{const $=id=>document.getElementById(id);const data={valid:{status:"Carte valide — SIMULATION",cls:"valid",nom:"EXEMPLE",prenom:"AMINATA",numero:"TEST123456",birth:"12/06/1995",start:"01/01/2026",end:"31/12/2027"},expired:{status:"Couverture expirée — SIMULATION",cls:"expired",nom:"DEMONSTRATION",prenom:"MOUSSA",numero:"TEST987654",birth:"03/09/1982",start:"01/01/2024",end:"31/12/2025"},unknown:{status:"À vérifier — aucune réponse officielle",cls:"unknown",nom:"Non disponible",prenom:"Non disponible",numero:"Non disponible",birth:"Non disponible",start:"Non disponible",end:"Non disponible"}};$("simulate").onclick=()=>{const d=data[$("scenario").value];$("status").textContent=d.status;$("status").className="state "+d.cls;for(const id of ["nom","prenom","numero","birth","start","end"])$(id).textContent=d[id];$("source").textContent="Source : simulation locale, sans valeur officielle.";$("result").hidden=false}})();</script></body></html>
